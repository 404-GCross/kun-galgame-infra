    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
info:
  title: KUN Galgame Wiki — Release Calendar
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/galgame/calendar:
    get:
      operationId: getGalgameCalendarMonth
      parameters:
        - description: "ISO month YYYY-MM (default: current JST month)"
          explode: false
          in: query
          name: month
          schema:
            description: "ISO month YYYY-MM (default: current JST month)"
            type: string
        - description: sfw | nsfw | all (default sfw)
          explode: false
          in: query
          name: content_limit
          schema:
            description: sfw | nsfw | all (default sfw)
            type: string
        - description: CSV of original languages; 'all' = no filter (default ja-jp,zh-cn,zh-tw)
          explode: false
          in: query
          name: original_language
          schema:
            description: CSV of original languages; 'all' = no filter (default ja-jp,zh-cn,zh-tw)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalEnvelopeCalendarMonthData"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Release calendar for one ISO month (day + month precision, mixed released/upcoming)
      tags:
        - galgame-calendar
  /api/galgame/calendar/pending:
    get:
      operationId: getGalgameCalendarPending
      parameters:
        - description: "Year YYYY (default: current JST year)"
          explode: false
          in: query
          name: year
          schema:
            description: "Year YYYY (default: current JST year)"
            type: string
        - description: sfw | nsfw | all (default sfw)
          explode: false
          in: query
          name: content_limit
          schema:
            description: sfw | nsfw | all (default sfw)
            type: string
        - description: CSV of original languages; 'all' = no filter
          explode: false
          in: query
          name: original_language
          schema:
            description: CSV of original languages; 'all' = no filter
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalEnvelopeCalendarPendingData"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Year-known, month-undecided bucket for a year
      tags:
        - galgame-calendar
  /api/galgame/calendar/tba:
    get:
      operationId: getGalgameCalendarTBA
      parameters:
        - description: sfw | nsfw | all (default sfw)
          explode: false
          in: query
          name: content_limit
          schema:
            description: sfw | nsfw | all (default sfw)
            type: string
        - description: CSV of original languages; 'all' = no filter
          explode: false
          in: query
          name: original_language
          schema:
            description: CSV of original languages; 'all' = no filter
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalEnvelopeCalendarTBAData"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Global release-date-TBA bucket
      tags:
        - galgame-calendar
