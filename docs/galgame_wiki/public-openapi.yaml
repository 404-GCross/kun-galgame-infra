info:
  title: NextMoe Open API — Galgame
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/galgame:
    get:
      operationId: listGalgamesPublic
      parameters:
        - description: "Sort key: id (default, ascending) or release_date (newest first, undated last)"
          explode: false
          in: query
          name: sort
          schema:
            description: "Sort key: id (default, ascending) or release_date (newest first, undated last)"
            enum:
              - id
              - release_date
            type: string
        - description: Opaque keyset cursor from a prior response's next_cursor; omit for the first page
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque keyset cursor from a prior response's next_cursor; omit for the first page
            type: string
        - description: Items per page 1-100 (default 20)
          explode: false
          in: query
          name: limit
          schema:
            description: Items per page 1-100 (default 20)
            format: int64
            type: integer
        - description: "Comma-separated blocks to expand on each item: officials,scores,meta,intro (default: none). Unknown names are ignored."
          explode: false
          in: query
          name: include
          schema:
            description: "Comma-separated blocks to expand on each item: officials,scores,meta,intro (default: none). Unknown names are ignored."
            type: string
        - description: Comma-separated top-level response keys to return (sparse fieldset); id is always included and unknown names are ignored (never a 400). Write keys in alphabetical order to maximize CDN cache hits.
          explode: false
          in: query
          name: fields
          schema:
            description: Comma-separated top-level response keys to return (sparse fieldset); id is always included and unknown names are ignored (never a 400). Write keys in alphabetical order to maximize CDN cache hits.
            type: string
        - description: "Content filter: sfw (default) | nsfw | all. nsfw/all require a key with the galgame:nsfw scope; otherwise silently coerced to sfw."
          explode: false
          in: query
          name: content_limit
          schema:
            description: "Content filter: sfw (default) | nsfw | all. nsfw/all require a key with the galgame:nsfw scope; otherwise silently coerced to sfw."
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEnvelopePublicListData"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Cursor-paginated galgame list (thin aggregate items); sort=id|release_date, keyset cursor, no offset
      tags:
        - galgame-public
  /v1/galgame/batch:
    get:
      operationId: batchGalgamesPublic
      parameters:
        - description: Comma-separated galgame IDs (1-100)
          explode: false
          in: query
          name: ids
          schema:
            description: Comma-separated galgame IDs (1-100)
            type: string
        - description: brief (default) = thin items; detail = full aggregate records (no include)
          explode: false
          in: query
          name: view
          schema:
            description: brief (default) = thin items; detail = full aggregate records (no include)
            enum:
              - brief
              - detail
            type: string
        - description: "Comma-separated blocks to expand on each item (brief view only): officials,scores,meta,intro (default: none). Unknown names are ignored."
          explode: false
          in: query
          name: include
          schema:
            description: "Comma-separated blocks to expand on each item (brief view only): officials,scores,meta,intro (default: none). Unknown names are ignored."
            type: string
        - description: Comma-separated top-level response keys to return (sparse fieldset); id is always included and unknown names are ignored (never a 400). Write keys in alphabetical order to maximize CDN cache hits.
          explode: false
          in: query
          name: fields
          schema:
            description: Comma-separated top-level response keys to return (sparse fieldset); id is always included and unknown names are ignored (never a 400). Write keys in alphabetical order to maximize CDN cache hits.
            type: string
        - description: "Content filter: sfw (default) | nsfw | all. nsfw/all require a key with the galgame:nsfw scope; otherwise silently coerced to sfw."
          explode: false
          in: query
          name: content_limit
          schema:
            description: "Content filter: sfw (default) | nsfw | all. nsfw/all require a key with the galgame:nsfw scope; otherwise silently coerced to sfw."
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEnvelopePublicBatchData"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Batch aggregate items by id (view=brief default = thin items; view=detail = full records, no include)
      tags:
        - galgame-public
  /v1/galgame/calendar:
    get:
      operationId: getGalgameCalendarPublic
      parameters:
        - description: "ISO month YYYY-MM (default: current JST month)"
          explode: false
          in: query
          name: month
          schema:
            description: "ISO month YYYY-MM (default: current JST month)"
            type: string
        - description: CSV of BCP-47 tags, or 'all'
          explode: false
          in: query
          name: original_language
          schema:
            description: CSV of BCP-47 tags, or 'all'
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEnvelopeCalendarMonthData"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Release calendar for one ISO month (sfw)
      tags:
        - galgame-public
  /v1/galgame/calendar/pending:
    get:
      operationId: getGalgameCalendarPendingPublic
      parameters:
        - description: "Year YYYY (default: current JST year)"
          explode: false
          in: query
          name: year
          schema:
            description: "Year YYYY (default: current JST year)"
            type: string
        - description: CSV of BCP-47 tags, or 'all'
          explode: false
          in: query
          name: original_language
          schema:
            description: CSV of BCP-47 tags, or 'all'
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEnvelopeCalendarPendingData"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Release calendar 'month TBD' bucket for a year (sfw)
      tags:
        - galgame-public
  /v1/galgame/calendar/tba:
    get:
      operationId: getGalgameCalendarTBAPublic
      parameters:
        - description: CSV of BCP-47 tags, or 'all'
          explode: false
          in: query
          name: original_language
          schema:
            description: CSV of BCP-47 tags, or 'all'
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEnvelopeCalendarTBAData"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Release calendar 'date TBA' bucket (sfw)
      tags:
        - galgame-public
  /v1/galgame/changes:
    get:
      operationId: getGalgameChangesPublic
      parameters:
        - description: Opaque keyset cursor from a prior response's next_cursor; omit for the first page
          explode: false
          in: query
