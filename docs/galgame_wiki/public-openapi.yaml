info:
  title: NextMoe Open API — Galgame
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/galgame:
    get:
      operationId: listGalgamesPublic
      parameters:
        - description: "Sort key: id (default, ascending) or release_date (newest first, undated last)"
          explode: false
          in: query
          name: sort
          schema:
            description: "Sort key: id (default, ascending) or release_date (newest first, undated last)"
            enum:
              - id
              - release_date
            type: string
        - description: Opaque keyset cursor from a prior response's next_cursor; omit for the first page
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque keyset cursor from a prior response's next_cursor; omit for the first page
            type: string
        - description: Items per page 1-100 (default 20)
          explode: false
          in: query
          name: limit
          schema:
            description: Items per page 1-100 (default 20)
            format: int64
            type: integer
        - description: Reserved; Phase 1 is always sfw
          explode: false
          in: query
          name: content_limit
          schema:
            description: Reserved; Phase 1 is always sfw
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEnvelopePublicListData"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Cursor-paginated galgame list (thin aggregate items); sort=id|release_date, keyset cursor, no offset
      tags:
        - galgame-public
