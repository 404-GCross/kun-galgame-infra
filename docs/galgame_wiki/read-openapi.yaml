          type: integer
      required:
        - galgames
        - total
      type: object
    UserGalgameStats:
      additionalProperties: false
      properties:
        galgame_contributed:
          format: int64
          type: integer
        galgame_created:
          format: int64
          type: integer
        galgame_created_today:
          format: int64
          type: integer
        pr_declined:
          format: int64
          type: integer
        pr_merged:
          format: int64
          type: integer
        pr_pending:
          format: int64
          type: integer
        pr_submitted:
          format: int64
          type: integer
        revision_count:
          format: int64
          type: integer
      required:
        - galgame_created
        - galgame_created_today
        - galgame_contributed
        - revision_count
        - pr_submitted
        - pr_merged
        - pr_declined
        - pr_pending
      type: object
    VNDBScore:
      additionalProperties: false
      properties:
        rating:
          format: double
          type:
            - number
            - "null"
        url:
          type: string
        vote_count:
          format: int64
          type: integer
      required:
        - rating
        - vote_count
        - url
      type: object
info:
  title: KUN Galgame Wiki — Reads
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/galgame:
    get:
      operationId: listGalgames
      parameters:
        - description: Page number (default 1)
          explode: false
          in: query
          name: page
          schema:
            description: Page number (default 1)
            format: int64
            type: integer
        - description: Items per page 1-50 (default 24)
          explode: false
          in: query
          name: limit
          schema:
            description: Items per page 1-50 (default 24)
            format: int64
            type: integer
        - description: Sort field (default created)
          explode: false
          in: query
          name: sort_field
          schema:
            description: Sort field (default created)
            enum:
              - created
              - updated
              - view
              - resource_update_time
              - release_date
            type: string
        - description: Sort direction (default desc)
          explode: false
          in: query
          name: sort_order
          schema:
            description: Sort direction (default desc)
            enum:
              - asc
              - desc
            type: string
        - description: Keyword across the four localized names
          explode: false
          in: query
          name: search
          schema:
            description: Keyword across the four localized names
            type: string
        - description: sfw | nsfw | all (default sfw)
          explode: false
          in: query
          name: content_limit
          schema:
            description: sfw | nsfw | all (default sfw)
            type: string
        - description: Release lower bound, YYYY or YYYY-MM
          explode: false
          in: query
          name: released_from
          schema:
            description: Release lower bound, YYYY or YYYY-MM
            type: string
        - description: Release upper bound, YYYY or YYYY-MM
          explode: false
          in: query
          name: released_to
          schema:
            description: Release upper bound, YYYY or YYYY-MM
            type: string
        - description: CSV of discontinuous months 1-12, AND'd on the year range
          explode: false
          in: query
          name: released_months
          schema:
            description: CSV of discontinuous months 1-12, AND'd on the year range
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalEnvelopeGalgameListData"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Paginated galgame list (search + sort + release-date filters); items are the full galgame shape with the list's preload subset populated
      tags:
        - galgame-read
  /api/galgame/batch:
    get:
      operationId: batchGetGalgames
      parameters:
        - description: Comma-separated galgame IDs (1-100)
          explode: false
          in: query
          name: ids
          schema:
            description: Comma-separated galgame IDs (1-100)
            type: string
        - description: sfw | nsfw | all (default sfw)
          explode: false
          in: query
          name: content_limit
          schema:
            description: sfw | nsfw | all (default sfw)
            type: string
        - description: brief (default) = GalgameBrief; detail = GalgameDetailBrief (adds release_date / intro_* / officials)
          explode: false
          in: query
          name: view
          schema:
            description: brief (default) = GalgameBrief; detail = GalgameDetailBrief (adds release_date / intro_* / officials)
            enum:
              - brief
              - detail
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalEnvelopeListGalgameDetailBrief"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Batch galgame briefs (view=brief default; view=detail adds intro/officials/release)
      tags:
        - galgame-read
  /api/galgame/check:
    get:
      operationId: checkGalgameVNDB
      parameters:
        - description: VNDB id to check (e.g. v12345)
          explode: false
          in: query
          name: vndb_id
          schema:
            description: VNDB id to check (e.g. v12345)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalEnvelopeCheckVNDBResult"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Whether a vndb_id already exists (and which galgame holds it)
      tags:
        - galgame-read
  /api/galgame/drafts:
    get:
      operationId: listGalgameDrafts
      parameters:
        - description: Page number (default 1)
          explode: false
          in: query
          name: page
