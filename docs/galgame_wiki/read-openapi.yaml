            type: integer
          type:
            - array
            - "null"
        tag_names:
          items:
            type: string
          type:
            - array
            - "null"
        updated_ts:
          format: int64
          type: integer
        user_id:
          format: int64
          type: integer
        view:
          format: int64
          type: integer
        vndb_id:
          type: string
      required:
        - id
        - vndb_id
        - name_zh_cn
        - name_ja_jp
        - name_en_us
        - name_zh_tw
        - aliases
        - tag_names
        - tag_ids
        - official_names
        - official_ids
        - engine_names
        - engine_ids
        - intro_zh_cn
        - intro_ja_jp
        - intro_en_us
        - intro_zh_tw
        - banner
        - effective_banner_hash
        - content_limit
        - age_limit
        - original_language
        - status
        - user_id
        - view
        - release_date
        - release_date_tba
        - updated_ts
        - created_ts
      type: object
    UserBrief:
      additionalProperties: false
      properties:
        avatar:
          type: string
        avatar_image_hash:
          type: string
        id:
          format: int64
          type: integer
        name:
          type: string
      required:
        - id
        - name
        - avatar
      type: object
    UserGalgameListData:
      additionalProperties: false
      properties:
        galgames:
          items:
            $ref: "#/components/schemas/GalgameBrief"
          type:
            - array
            - "null"
        total:
          format: int64
          type: integer
      required:
        - galgames
        - total
      type: object
    UserGalgameStats:
      additionalProperties: false
      properties:
        galgame_contributed:
          format: int64
          type: integer
        galgame_created:
          format: int64
          type: integer
        galgame_created_today:
          format: int64
          type: integer
        pr_declined:
          format: int64
          type: integer
        pr_merged:
          format: int64
          type: integer
        pr_pending:
          format: int64
          type: integer
        pr_submitted:
          format: int64
          type: integer
        revision_count:
          format: int64
          type: integer
      required:
        - galgame_created
        - galgame_created_today
        - galgame_contributed
        - revision_count
        - pr_submitted
        - pr_merged
        - pr_declined
        - pr_pending
      type: object
info:
  title: KUN Galgame Wiki — Reads
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/galgame:
    get:
      operationId: listGalgames
      parameters:
        - description: Page number (default 1)
          explode: false
          in: query
          name: page
          schema:
            description: Page number (default 1)
            format: int64
            type: integer
        - description: Items per page 1-50 (default 24)
          explode: false
          in: query
          name: limit
          schema:
            description: Items per page 1-50 (default 24)
            format: int64
            type: integer
        - description: Sort field (default created)
          explode: false
          in: query
          name: sort_field
          schema:
            description: Sort field (default created)
            enum:
              - created
              - updated
              - view
              - resource_update_time
              - release_date
            type: string
        - description: Sort direction (default desc)
          explode: false
          in: query
          name: sort_order
          schema:
            description: Sort direction (default desc)
            enum:
              - asc
              - desc
            type: string
        - description: Keyword across the four localized names
          explode: false
          in: query
          name: search
          schema:
            description: Keyword across the four localized names
            type: string
        - description: sfw | nsfw | all (default sfw)
          explode: false
          in: query
          name: content_limit
          schema:
            description: sfw | nsfw | all (default sfw)
            type: string
        - description: Release lower bound, YYYY or YYYY-MM
          explode: false
          in: query
          name: released_from
          schema:
            description: Release lower bound, YYYY or YYYY-MM
            type: string
        - description: Release upper bound, YYYY or YYYY-MM
          explode: false
          in: query
          name: released_to
          schema:
            description: Release upper bound, YYYY or YYYY-MM
            type: string
        - description: CSV of discontinuous months 1-12, AND'd on the year range
          explode: false
          in: query
          name: released_months
          schema:
            description: CSV of discontinuous months 1-12, AND'd on the year range
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalEnvelopeGalgameListData"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Paginated galgame list (search + sort + release-date filters); items are the full galgame shape with the list's preload subset populated
      tags:
        - galgame-read
  /api/galgame/batch:
    get:
      operationId: batchGetGalgames
      parameters:
        - description: Comma-separated galgame IDs (1-100)
          explode: false
          in: query
          name: ids
          schema:
            description: Comma-separated galgame IDs (1-100)
            type: string
        - description: sfw | nsfw | all (default sfw)
          explode: false
          in: query
          name: content_limit
          schema:
            description: sfw | nsfw | all (default sfw)
            type: string
        - description: brief (default) = GalgameBrief; detail = GalgameDetailBrief (adds release_date / intro_* / officials)
          explode: false
          in: query
          name: view
          schema:
            description: brief (default) = GalgameBrief; detail = GalgameDetailBrief (adds release_date / intro_* / officials)
            enum:
              - brief
              - detail
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalEnvelopeListGalgameDetailBrief"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Batch galgame briefs (view=brief default; view=detail adds intro/officials/release)
      tags:
        - galgame-read
  /api/galgame/check:
    get:
      operationId: checkGalgameVNDB
      parameters:
        - description: VNDB id to check (e.g. v12345)
          explode: false
          in: query
          name: vndb_id
          schema:
            description: VNDB id to check (e.g. v12345)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalEnvelopeCheckVNDBResult"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Whether a vndb_id already exists (and which galgame holds it)
      tags:
        - galgame-read
  /api/galgame/search:
    get:
      operationId: searchGalgames
      parameters:
        - description: Full-text query (localized names / aliases; tag/studio names with include_intro)
          explode: false
          in: query
          name: q
          schema:
            description: Full-text query (localized names / aliases; tag/studio names with include_intro)
            type: string
        - description: CSV of statuses; non-admins clamped to {0,2}, default 0 (published)
          explode: false
          in: query
          name: status
          schema:
            description: CSV of statuses; non-admins clamped to {0,2}, default 0 (published)
            type: string
        - description: sfw | nsfw | all (default sfw)
          explode: false
          in: query
          name: content_limit
          schema:
            description: sfw | nsfw | all (default sfw)
            type: string
        - description: all | r18
          explode: false
          in: query
          name: age_limit
          schema:
            description: all | r18
            type: string
        - description: CSV; OR filter
          explode: false
          in: query
          name: original_language
          schema:
            description: CSV; OR filter
            type: string
        - description: CSV; AND filter
          explode: false
          in: query
          name: tag_ids
          schema:
            description: CSV; AND filter
            type: string
        - description: CSV; AND filter
          explode: false
          in: query
          name: official_ids
          schema:
            description: CSV; AND filter
            type: string
        - description: CSV; AND filter
          explode: false
          in: query
          name: engine_ids
          schema:
            description: CSV; AND filter
            type: string
        - description: Exact series id
          explode: false
          in: query
          name: series_id
          schema:
            description: Exact series id
            type: string
        - description: YYYY or YYYY-MM
          explode: false
          in: query
          name: released_from
          schema:
            description: YYYY or YYYY-MM
            type: string
        - description: YYYY or YYYY-MM
          explode: false
          in: query
          name: released_to
          schema:
            description: YYYY or YYYY-MM
            type: string
        - description: CSV of months 1-12, AND'd on the year range
          explode: false
          in: query
          name: released_months
          schema:
            description: CSV of months 1-12, AND'd on the year range
            type: string
        - description: Also search intro_* / tag / official names
          explode: false
          in: query
          name: include_intro
          schema:
            description: Also search intro_* / tag / official names
            type: boolean
        - description: Sort (default relevance)
          explode: false
          in: query
          name: sort
          schema:
            description: Sort (default relevance)
            enum:
              - relevance
              - released_desc
              - released_asc
              - view
              - updated
            type: string
        - description: Page number (default 1)
          explode: false
          in: query
          name: page
          schema:
            description: Page number (default 1)
            format: int64
            type: integer
        - description: Items per page (default 24, max 100)
          explode: false
          in: query
          name: limit
          schema:
            description: Items per page (default 24, max 100)
            format: int64
            type: integer
        - description: Return facet aggregation (default true)
          explode: false
          in: query
          name: facets
          schema:
            description: Return facet aggregation (default true)
            type: boolean
        - description: Return _formatted highlights (default true)
          explode: false
          in: query
          name: highlight
          schema:
            description: Return _formatted highlights (default true)
            type: boolean
        - description: CSV attribute projection; empty = all
          explode: false
          in: query
          name: fields
          schema:
            description: CSV attribute projection; empty = all
            type: string
        - description: Also return the viewer's own pending/declined (needs auth)
          explode: false
          in: query
          name: include_pending
          schema:
            description: Also return the viewer's own pending/declined (needs auth)
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalEnvelopeGalgameSearchData"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: "Full-text galgame search (Meilisearch): filters, facets, highlights, projection"
      tags:
        - galgame-read
  /api/galgame/user/{id}/contributed:
    get:
      operationId: listUserContributedGalgames
      parameters:
        - description: User ID
          in: path
          name: id
          required: true
          schema:
            description: User ID
            format: int64
            type: integer
        - description: Page number (default 1)
          explode: false
          in: query
          name: page
          schema:
            description: Page number (default 1)
            format: int64
            type: integer
        - description: Items per page 1-100 (default 24)
          explode: false
          in: query
          name: limit
          schema:
            description: Items per page 1-100 (default 24)
            format: int64
            type: integer
        - description: sfw | nsfw | all (default sfw)
          explode: false
          in: query
          name: content_limit
          schema:
            description: sfw | nsfw | all (default sfw)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalEnvelopeUserGalgameListData"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Galgames a user contributed to (briefs, paginated) — profile 参与编辑 tab
      tags:
        - galgame-read
  /api/galgame/user/{id}/galgames:
    get:
      operationId: listUserGalgames
      parameters:
        - description: User ID
          in: path
          name: id
          required: true
          schema:
            description: User ID
            format: int64
            type: integer
        - description: Page number (default 1)
          explode: false
          in: query
          name: page
          schema:
            description: Page number (default 1)
            format: int64
            type: integer
        - description: Items per page 1-100 (default 24)
          explode: false
          in: query
          name: limit
          schema:
            description: Items per page 1-100 (default 24)
            format: int64
            type: integer
        - description: sfw | nsfw | all (default sfw)
          explode: false
          in: query
          name: content_limit
          schema:
            description: sfw | nsfw | all (default sfw)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalEnvelopeUserGalgameListData"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: A user's published galgames (briefs, paginated) — profile 已发布 tab
      tags:
        - galgame-read
  /api/galgame/user/{id}/stats:
    get:
      operationId: getUserGalgameStats
      parameters:
        - description: User ID
          in: path
          name: id
          required: true
          schema:
            description: User ID
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalEnvelopeUserGalgameStats"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: A user's aggregate galgame contribution stats
      tags:
        - galgame-read
  /api/galgame/{gid}:
    get:
      operationId: getGalgameDetail
      parameters:
        - description: Galgame ID
          in: path
          name: gid
          required: true
          schema:
            description: Galgame ID
            format: int64
            type: integer
        - description: "sfw | nsfw | all (default: no filter)"
          explode: false
          in: query
          name: content_limit
          schema:
            description: "sfw | nsfw | all (default: no filter)"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalEnvelopeGalgameDetailResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Full galgame detail (all relations) + owner/contributor user briefs
      tags:
        - galgame-read
  /api/galgame/{gid}/aliases:
    get:
      operationId: getGalgameAliases
      parameters:
        - description: Galgame ID
          in: path
          name: gid
          required: true
          schema:
            description: Galgame ID
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalEnvelopeListDetailAlias"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: A galgame's alternative names
      tags:
        - galgame-read
  /api/galgame/{gid}/contributors:
    get:
      operationId: getGalgameContributors
      parameters:
        - description: Galgame ID
          in: path
          name: gid
          required: true
          schema:
            description: Galgame ID
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalEnvelopeListGalgameContributorWithUser"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: A galgame's contributors, each with the resolved user brief
      tags:
        - galgame-read
  /api/galgame/{gid}/links:
    get:
      operationId: getGalgameLinks
      parameters:
        - description: Galgame ID
          in: path
          name: gid
          required: true
          schema:
            description: Galgame ID
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalEnvelopeListDetailLink"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: A galgame's external links (official sites, stores, socials)
      tags:
        - galgame-read
