info:
  title: KUN Galgame Wiki — Reads
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/galgame/batch:
    get:
      operationId: batchGetGalgames
      parameters:
        - description: Comma-separated galgame IDs (1-100)
          explode: false
          in: query
          name: ids
          schema:
            description: Comma-separated galgame IDs (1-100)
            type: string
        - description: sfw | nsfw | all (default sfw)
          explode: false
          in: query
          name: content_limit
          schema:
            description: sfw | nsfw | all (default sfw)
            type: string
        - description: brief (default) = GalgameBrief; detail = GalgameDetailBrief (adds release_date / intro_* / officials)
          explode: false
          in: query
          name: view
          schema:
            description: brief (default) = GalgameBrief; detail = GalgameDetailBrief (adds release_date / intro_* / officials)
            enum:
              - brief
              - detail
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalEnvelopeListGalgameDetailBrief"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Batch galgame briefs (view=brief default; view=detail adds intro/officials/release)
      tags:
        - galgame-read
