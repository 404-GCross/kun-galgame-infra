            description: Page number (default 1)
            format: int64
            type: integer
        - description: Items per page 1-50 (default 24)
          explode: false
          in: query
          name: limit
          schema:
            description: Items per page 1-50 (default 24)
            format: int64
            type: integer
        - description: sfw | nsfw | all (default sfw)
          explode: false
          in: query
          name: content_limit
          schema:
            description: sfw | nsfw | all (default sfw)
            type: string
        - description: Scope to one official's drafts (0/absent = global). Drafts carry VNDB-synced official edges.
          explode: false
          in: query
          name: official_id
          schema:
            description: Scope to one official's drafts (0/absent = global). Drafts carry VNDB-synced official edges.
            format: int64
            type: integer
        - description: Scope to one tag's drafts (0/absent = global). Drafts carry VNDB-synced tag edges.
          explode: false
          in: query
          name: tag_id
          schema:
            description: Scope to one tag's drafts (0/absent = global). Drafts carry VNDB-synced tag edges.
            format: int64
            type: integer
        - description: "Scope to one engine's drafts (0/absent = global). Empty by data today: engine edges are human-curated and drafts are untouched VNDB imports."
          explode: false
          in: query
          name: engine_id
          schema:
            description: "Scope to one engine's drafts (0/absent = global). Empty by data today: engine edges are human-curated and drafts are untouched VNDB imports."
            format: int64
            type: integer
        - description: CSV of original-language codes to include (e.g. ja-jp,zh-cn,zh-tw); absent = all languages. Max 8 values.
          explode: false
          in: query
          name: original_language
          schema:
            description: CSV of original-language codes to include (e.g. ja-jp,zh-cn,zh-tw); absent = all languages. Max 8 values.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalEnvelopeGalgameListData"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Paginated unclaimed VNDB drafts (status=2), newest first — the claim-funnel browser; same envelope as the list
      tags:
        - galgame-read
