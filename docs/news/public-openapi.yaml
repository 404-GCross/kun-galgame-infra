components:
  schemas:
    EnvelopePublicNewsFeedData:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopePublicNewsFeedData.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/PublicNewsFeedData"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopePublicNewsItem:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopePublicNewsItem.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/PublicNewsItem"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopePublicNewsSourcesData:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopePublicNewsSourcesData.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/PublicNewsSourcesData"
        message:
          type: string
      required:
        - code
        - message
      type: object
    HouseError:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/HouseError.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data: {}
        message:
          type: string
      required:
        - code
        - message
      type: object
    PublicNewsFeedData:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        items:
          items:
            $ref: "#/components/schemas/PublicNewsItem"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
        - count
      type: object
    PublicNewsItem:
      additionalProperties: false
      properties:
        banner_url:
          type: string
        id:
          format: int64
          type: integer
        images:
          items:
            type: string
          type:
            - array
            - "null"
        lane:
          type: string
        preview:
          type: string
        published_at:
          format: date-time
          type: string
        source:
          $ref: "#/components/schemas/PublicNewsSource"
        source_url:
          type: string
        title:
          type: string
        work_ids:
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
      required:
        - id
        - source
        - lane
        - source_url
        - title
        - preview
        - published_at
      type: object
    PublicNewsSource:
      additionalProperties: false
      properties:
        attribution:
          type: string
        column_url:
          type: string
        display_name:
          type: string
        homepage_url:
          type: string
        key:
          type: string
        publisher_uid:
          format: int64
          type: integer
      required:
        - key
        - display_name
        - homepage_url
        - attribution
        - column_url
        - publisher_uid
      type: object
    PublicNewsSourcesData:
      additionalProperties: false
      properties:
        sources:
          items:
            $ref: "#/components/schemas/PublicNewsSource"
          type:
            - array
            - "null"
      required:
        - sources
      type: object
info:
  title: NextMoe Open API — News
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/news:
    get:
      description: "Every item carries its source block and source_url unconditionally: the partners authorised an INDEX, not a mirror. The article body is never served here and is not stored — preview plus banner is the whole authorisation, and readers reach the full text by following source_url to the partner's own site. Items we withdrew, and items whose upstream original has disappeared, are absent from this feed. Two lanes share the feed — 'news' (short bulletins) and 'column' (longer editorial pieces) — and every item states which one it came from."
      operationId: listNewsPublic
      parameters:
        - description: Comma-separated source keys to keep (ymgal, galgame_hihyou); omit or 'all' for every source
          explode: false
          in: query
          name: source
          schema:
            description: Comma-separated source keys to keep (ymgal, galgame_hihyou); omit or 'all' for every source
            type: string
        - description: "Comma-separated lanes to keep: news, column. Omit or 'all' for both. An unknown lane is rejected, never silently empty"
          explode: false
          in: query
          name: lane
          schema:
            description: "Comma-separated lanes to keep: news, column. Omit or 'all' for both. An unknown lane is rejected, never silently empty"
            type: string
        - description: Keep only items anchored to this catalog work id
          explode: false
          in: query
          name: work_id
          schema:
            description: Keep only items anchored to this catalog work id
            format: int64
            type: integer
        - description: RFC3339 lower bound on the UPSTREAM publication time
          explode: false
          in: query
          name: published_after
          schema:
            description: RFC3339 lower bound on the UPSTREAM publication time
            type: string
        - description: RFC3339 upper bound on the UPSTREAM publication time
          explode: false
          in: query
          name: published_before
          schema:
            description: RFC3339 upper bound on the UPSTREAM publication time
            type: string
        - description: Opaque keyset cursor from a prior response's next_cursor; omit for the first page
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque keyset cursor from a prior response's next_cursor; omit for the first page
            type: string
        - description: Items per page 1-50 (default 20)
          explode: false
          in: query
          name: limit
          schema:
            description: Items per page 1-50 (default 20)
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicNewsFeedData"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Galgame news feed republished from partner sites, newest upstream publication first
      tags:
        - news-public
  /v1/news/sources:
    get:
      description: For pages that render one standing attribution block. It does NOT replace the per-item source block — an item taken on its own must still carry its own attribution.
      operationId: listNewsSourcesPublic
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicNewsSourcesData"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: "The source registry: display name, homepage, column entry point, publisher uid, and the attribution text to render"
      tags:
        - news-public
  /v1/news/{id}:
    get:
      description: "The 404 is a contract, not a lookup failure: a withdrawn item must stop being addressable."
      operationId: getNewsPublic
      parameters:
        - description: News item id
          in: path
          name: id
          required: true
          schema:
            description: News item id
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicNewsItem"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: One news item; 404 once it is unpublished, withdrawn, or gone upstream
      tags:
        - news-public
