          type: integer
        flags_disagreed:
          format: int32
          type: integer
        granted_boost:
          format: int32
          type: integer
        level:
          format: int32
          type: integer
        likes_given:
          format: int32
          type: integer
        likes_received:
          format: int32
          type: integer
        posts_read:
          format: int32
          type: integer
        read_time_s:
          format: int32
          type: integer
        topics_entered:
          format: int32
          type: integer
        user_id:
          format: int64
          type: integer
      required:
        - user_id
        - level
        - first_posts_held_remaining
      type: object
info:
  title: KUN Community Service
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/community/comments/resolve:
    post:
      operationId: resolveComments
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentsResolveRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeThreadWithPosts"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Get-or-create the comments thread for an anchor and return its first page of posts
      tags:
        - community-read
  /api/v1/community/feedback:
    post:
      operationId: openFeedback
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenFeedbackRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeThreadResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Open a feedback thread with its opening post
      tags:
        - community-write
  /api/v1/community/feedback/{id}/merge:
    post:
      operationId: mergeFeedback
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackMergeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOKResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Merge a duplicate feedback thread into another (reversible)
      tags:
        - community-write
  /api/v1/community/feedback/{id}/status:
    post:
      operationId: setFeedbackStatus
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackStatusRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOKResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Set a feedback thread's status and official response
      tags:
        - community-write
  /api/v1/community/posts/{id}:
    delete:
      operationId: deletePost
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
        - description: the acting user; must be the post's author
          explode: false
          in: query
          name: author_id
          schema:
            description: the acting user; must be the post's author
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOKResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Delete a post (author self-delete; tombstone, post_number preserved)
      tags:
        - community-write
    patch:
      operationId: editPost
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditPostRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePostResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Edit a post (author only; re-sanitized, stamps edited_at)
      tags:
        - community-write
  /api/v1/community/posts/{id}/flag:
    post:
      operationId: submitFlag
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlagRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOKResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Report a post
      tags:
        - community-write
  /api/v1/community/posts/{id}/reaction:
    post:
      operationId: toggleReaction
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionToggleRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeReactionToggleResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Toggle a reaction on a post
      tags:
        - community-write
  /api/v1/community/review:
    get:
      operationId: listReview
      parameters:
        - description: filter to one source; -1 = all
          explode: false
          in: query
          name: source
          schema:
            default: -1
            description: filter to one source; -1 = all
            format: int32
            type: integer
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeReviewListResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: List the site's pending moderation-queue items
      tags:
        - community-review
  /api/v1/community/review/{id}/approve:
    post:
      operationId: approveReview
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOKResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Approve a queue item (keep the content; restore the post)
      tags:
        - community-review
  /api/v1/community/review/{id}/reject:
    post:
      operationId: rejectReview
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOKResponse"
