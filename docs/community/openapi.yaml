components:
  schemas:
    ActivityReceiptRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ActivityReceiptRequest.json
          format: uri
          readOnly: true
          type: string
        days_visited:
          format: int32
          type: integer
        posts_read:
          format: int32
          type: integer
        read_time_s:
          format: int32
          type: integer
        topics_entered:
          format: int32
          type: integer
        user_id:
          format: int64
          type: integer
        window_active_days:
          format: int32
          type: integer
      required:
        - user_id
        - topics_entered
        - posts_read
        - read_time_s
        - days_visited
      type: object
    CommentsResolveRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/CommentsResolveRequest.json
          format: uri
          readOnly: true
          type: string
        anchor_id:
          type: string
        anchor_kind:
          description: 0=board 1=site_game 2=site_resource 3=catalog_work 4=catalog_person
          format: int32
          type: integer
        content_rating:
          description: 0=all 1=r15 2=r18 (inherited from the anchor)
          format: int32
          type: integer
      required:
        - anchor_kind
        - anchor_id
        - content_rating
      type: object
    EditPostRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EditPostRequest.json
          format: uri
          readOnly: true
          type: string
        author_id:
          format: int64
          type: integer
        body:
          description: new markdown source; re-cooked + sanitized on write
          type: string
      required:
        - author_id
        - body
      type: object
    EnvelopeOKResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeOKResponse.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
