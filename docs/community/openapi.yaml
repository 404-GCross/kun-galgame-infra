          type: integer
        id:
          format: int64
          type: integer
        kind:
          format: int32
          type: integer
        last_posted_at:
          format: date-time
          type: string
        merged_into_id:
          format: int64
          type: integer
        participants_count:
          format: int32
          type: integer
        posts_count:
          format: int32
          type: integer
        site:
