          type: integer
        answer_post_id:
          format: int64
          type: integer
        content_rating:
          format: int32
          type: integer
        created_at:
          format: date-time
          type: string
        created_by:
          format: int64
          type: integer
        fb_response:
          type: string
        fb_status:
          format: int32
          type: integer
