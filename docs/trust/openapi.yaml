components:
  schemas:
    EnvelopeReportResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeReportResponse.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/ReportResponse"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopeSubjectKindsResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeSubjectKindsResponse.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/SubjectKindsResponse"
        message:
          type: string
      required:
        - code
        - message
      type: object
    HouseError:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/HouseError.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        message:
          type: string
      required:
        - code
        - message
      type: object
    ReportRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ReportRequest.json
          format: uri
          readOnly: true
          type: string
        note:
          type: string
        reason_key:
          description: a global or per-site reason key (abuse/spam/…)
          type: string
        reporter_id:
          description: the reporting user's global id (P0 requires login)
          format: int64
          type: integer
        snapshot:
          description: reporter-carried content snapshot at report time
          type: string
        subject_id:
          description: the subject's stable id in the product
          type: string
        subject_kind:
          description: registered subject kind for this site (e.g. forum_topic)
          type: string
      required:
        - subject_kind
        - subject_id
        - reason_key
        - reporter_id
      type: object
    ReportResponse:
      additionalProperties: false
      properties:
        report_id:
          format: int64
          type: integer
        review_item_id:
          description: set when the report opened/linked/folded a review item
          format: int64
          type: integer
      required:
        - report_id
      type: object
    SubjectKindView:
      additionalProperties: false
      properties:
        callback_url:
          type: string
        created_at:
          format: date-time
          type: string
        has_secret:
          type: boolean
        id:
          format: int64
          type: integer
        is_deprecated:
          type: boolean
        key:
          type: string
        site:
          type: string
      required:
        - id
        - site
        - key
        - has_secret
        - is_deprecated
        - created_at
      type: object
    SubjectKindsResponse:
      additionalProperties: false
      properties:
        kinds:
          items:
            $ref: "#/components/schemas/SubjectKindView"
          type:
            - array
            - "null"
      required:
        - kinds
      type: object
info:
  title: KUN Trust Service
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/trust/reports:
    post:
      operationId: submitReport
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeReportResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Submit a report on a subject (dedup / rate-limit / weight / aggregate)
      tags:
        - trust-intake
  /api/v1/trust/subject-kinds:
    get:
      operationId: listSubjectKinds
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeSubjectKindsResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: List the calling site's registered subject kinds
      tags:
        - trust-intake
