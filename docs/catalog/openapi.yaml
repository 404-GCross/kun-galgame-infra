          format: uri
          readOnly: true
          type: string
        actor:
          $ref: "#/components/schemas/EditActor"
      required:
        - actor
      type: object
    EntityCounts:
      additionalProperties: false
      properties:
        characters:
          format: int64
          type: integer
        credit_names:
          format: int64
          type: integer
        labels:
          format: int64
          type: integer
        orgs:
          format: int64
          type: integer
        orphan_credit_names:
          description: credit_name.person_id IS NULL
          format: int64
          type: integer
        persons:
          format: int64
          type: integer
      required:
        - persons
        - credit_names
        - orphan_credit_names
        - orgs
        - labels
        - characters
      type: object
    EntitySearchHit:
      additionalProperties: false
      properties:
        entity_type:
          type: string
        id:
          description: "prefixed: n{id} / c{id} / b{id}"
          type: string
        kind:
          description: label kind (labels only)
          format: int32
          type: integer
        latin:
          type: string
        name:
          type: string
        person_id:
          description: credit-name → person link (names only; absent = orphan)
          format: int64
          type: integer
        popularity:
          format: double
          type: number
        sources:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - id
        - entity_type
        - name
        - sources
        - popularity
      type: object
    EntitySearchResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/EntitySearchHit"
          type:
            - array
            - "null"
        total:
          format: int64
          type: integer
      required:
        - items
        - total
      type: object
