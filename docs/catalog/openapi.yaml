info:
  title: KUN Catalog Service
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/catalog/characters/{id}:
    get:
      operationId: getCatalogCharacterByID
      parameters:
        - description: Catalog character id
          in: path
          name: id
          required: true
          schema:
            description: Catalog character id
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCharacterDetailResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Read a character's identity + aliases by catalog id
      tags:
        - catalog-s2s
  /api/v1/catalog/characters/{id}/works:
    get:
      operationId: getCatalogCharacterWorks
      parameters:
        - description: Catalog character id
          in: path
          name: id
          required: true
          schema:
            description: Catalog character id
            format: int64
            type: integer
        - description: Page size (capped at 50)
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Page size (capped at 50)
            format: int64
            type: integer
        - description: Rows to skip
          explode: false
          in: query
          name: offset
          schema:
            description: Rows to skip
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCharacterWorksResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Works a character appears in (roster edges ∪ voice credits) with kind + voice names
      tags:
        - catalog-s2s
  /api/v1/catalog/edit/diff:
    get:
      operationId: diffEditRevisions
      parameters:
        - explode: false
          in: query
          name: entity_type
          schema:
            minLength: 1
            type: string
        - explode: false
          in: query
          name: entity_id
          schema:
            format: int64
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: from_seq
          schema:
            format: int64
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: to_seq
          schema:
            format: int64
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeEditDiffResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Field-level diff between any two revisions
      tags:
        - catalog-edit
  /api/v1/catalog/edit/proposals:
    get:
      operationId: listEditProposals
      parameters:
        - description: Filter to one entity type
          explode: false
          in: query
          name: entity_type
          schema:
            description: Filter to one entity type
            type: string
        - description: Filter to one entity (requires entity_type)
          explode: false
          in: query
          name: entity_id
          schema:
            description: Filter to one entity (requires entity_type)
            format: int64
            type: integer
        - description: Filter to one tenant
          explode: false
          in: query
          name: site
          schema:
            description: Filter to one tenant
            type: string
        - description: Filter to one proposer (the BFF 'my proposals' face); 0 = all
          explode: false
          in: query
          name: proposer_uid
          schema:
            description: Filter to one proposer (the BFF 'my proposals' face); 0 = all
            format: int64
            type: integer
        - description: Filter by status; empty = all
          explode: false
          in: query
          name: status
          schema:
            description: Filter by status; empty = all
            enum:
              - ""
              - open
              - merged
              - declined
              - withdrawn
            type: string
        - description: Page size (max 200, default 50)
          explode: false
          in: query
          name: limit
          schema:
            description: Page size (max 200, default 50)
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeEditProposalListResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: List edit proposals (review queue)
      tags:
        - catalog-edit
    post:
      operationId: createEditProposal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditProposalCreateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeEditProposalCreateResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: File an edit proposal (automerges into a direct edit when policy allows)
      tags:
