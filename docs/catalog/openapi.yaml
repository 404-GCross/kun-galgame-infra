components:
  schemas:
    AnchorRef:
      additionalProperties: false
      properties:
        external_id:
          type: string
        link_kind:
          description: 0=exact 1=probable 2=related
          format: int32
          type: integer
        matched_by:
          type: string
        source:
          type: string
      required:
        - source
        - external_id
        - link_kind
      type: object
    AnchorTierCell:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        link_kind:
          description: 0=exact 1=probable 2=related
          format: int32
          type: integer
        source:
          type: string
      required:
        - source
        - link_kind
        - count
      type: object
    CatalogStats:
      additionalProperties: false
      properties:
        anchors_by_source_tier:
          items:
            $ref: "#/components/schemas/AnchorTierCell"
          type:
            - array
            - "null"
        attributions_by_kind:
          items:
            $ref: "#/components/schemas/KindCount"
          type:
            - array
            - "null"
        credits_by_source:
          items:
            $ref: "#/components/schemas/KeyCount"
          type:
            - array
            - "null"
        entities:
          $ref: "#/components/schemas/EntityCounts"
        llm_bid_verdicts:
          items:
            $ref: "#/components/schemas/KeyCount"
          type:
            - array
            - "null"
        queues:
          $ref: "#/components/schemas/QueueLevels"
        source_freshness:
          items:
            $ref: "#/components/schemas/SourceFreshness"
          type:
            - array
            - "null"
        works:
          $ref: "#/components/schemas/WorksMatrix"
      required:
        - works
        - entities
        - credits_by_source
        - attributions_by_kind
        - anchors_by_source_tier
        - queues
        - llm_bid_verdicts
        - source_freshness
      type: object
    CharacterAlias:
      additionalProperties: false
      properties:
        id:
          format: int64
          type: integer
        is_primary_for_locale:
          type: boolean
        kind:
          description: 0=translation 1=spelling_variant 2=search_hint
          format: int32
          type: integer
        lang:
          type: string
        latin:
          type: string
        name:
          type: string
      required:
        - id
        - name
        - lang
        - kind
        - is_primary_for_locale
      type: object
    CharacterDetailResponse:
      additionalProperties: false
      properties:
        aliases:
          items:
            $ref: "#/components/schemas/CharacterAlias"
          type:
            - array
            - "null"
        description:
          type: string
        display_name:
          type: string
        gender:
          format: int32
          type: integer
        id:
          format: int64
          type: integer
        image_hash:
          type: string
        instance_of:
          format: int64
          type: integer
        lang:
          type: string
        latin:
          type: string
      required:
        - id
        - display_name
        - lang
        - aliases
      type: object
    CharacterHead:
      additionalProperties: false
      properties:
        id:
          format: int64
          type: integer
        latin:
          type: string
        name:
          $ref: "#/components/schemas/NameBuckets"
      required:
        - id
        - name
      type: object
    CharacterWorkRow:
      additionalProperties: false
      properties:
        kind:
          description: "roster appearance strength: 0=unknown 1=main 2=secondary 3=appears (0 also when reached only via a voice credit)"
          format: int32
          type: integer
        spoiler:
          description: "roster appearance spoiler level: 0=none 1=minor 2=major (0 also when reached only via a voice credit)"
          format: int32
          type: integer
        voiced:
          description: true when a voice credit names this character on this work
          type: boolean
        voices:
          items:
            $ref: "#/components/schemas/VoiceName"
          type:
            - array
            - "null"
        work:
          $ref: "#/components/schemas/WorkBrief"
      required:
        - work
        - kind
        - spoiler
        - voiced
        - voices
      type: object
    CharacterWorksResponse:
      additionalProperties: false
      properties:
        character:
          $ref: "#/components/schemas/CharacterHead"
        items:
          items:
            $ref: "#/components/schemas/CharacterWorkRow"
          type:
            - array
            - "null"
        total:
          format: int64
          type: integer
      required:
        - character
        - items
        - total
      type: object
    ClaimAnchor:
      additionalProperties: false
      properties:
        external_id:
          minLength: 1
          type: string
        level:
          description: Anchor grain; defaults to work
          enum:
            - work
            - release
          type: string
        source_id:
          description: catalog_source registry id (e.g. 2=vndb 3=bangumi 4=dlsite)
          format: int32
          type: integer
      required:
        - source_id
        - external_id
      type: object
    ClaimWorkRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ClaimWorkRequest.json
          format: uri
          readOnly: true
          type: string
        anchors:
          description: External identity anchors; matched exact refs claim the existing registry row
          items:
            $ref: "#/components/schemas/ClaimAnchor"
          maxItems: 16
          type:
            - array
            - "null"
        content_rating:
          description: 0=all_ages 1=sensitive 2=r18
          format: int32
          maximum: 2
          minimum: 0
          type: integer
        display_name:
          minLength: 1
          type: string
        medium_id:
          description: catalog_medium registry id (1=galgame ...)
          format: int32
          type: integer
        olang:
          description: Original language (BCP-47); defaults to ja
          type: string
        product_work_id:
          description: The work's id inside the product database
          format: int64
          type: integer
        site:
          description: Claiming site key (e.g. galgame_wiki)
          minLength: 1
          type: string
      required:
        - medium_id
        - site
        - product_work_id
        - display_name
      type: object
    ClaimWorkResponse:
      additionalProperties: false
      properties:
        created:
          description: true when a new registry row was minted (no anchor matched)
          type: boolean
        work_id:
          format: int64
          type: integer
      required:
        - work_id
        - created
      type: object
    CreditGroup:
      additionalProperties: false
      properties:
        credits:
          items:
            $ref: "#/components/schemas/CreditItem"
          type:
            - array
            - "null"
        role_id:
          format: int64
          type: integer
        role_key:
          type: string
        role_name:
          type: string
      required:
        - role_id
        - role_key
        - role_name
        - credits
      type: object
    CreditItem:
      additionalProperties: false
      properties:
        character:
          type: string
        character_id:
          format: int64
          type: integer
        credit_name_id:
          format: int64
          type: integer
        lang:
          type: string
        latin:
          type: string
        name:
          type: string
        note:
          type: string
        source:
          type: string
      required:
        - credit_name_id
        - name
        - lang
      type: object
    EditActor:
      additionalProperties: false
      properties:
        roles:
          description: The user's roles as the product's JWT asserts them
          items:
            type: string
          type:
            - array
            - "null"
        trust_tier:
          description: Trust tier TL0-TL4 (doc 18)
          format: int32
          maximum: 4
          minimum: 0
          type: integer
        user_id:
          description: Product-side user id (the shared identity space)
          format: int64
          minimum: 1
          type: integer
      required:
        - user_id
      type: object
    EditAmendRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EditAmendRequest.json
          format: uri
          readOnly: true
          type: string
        actor:
          $ref: "#/components/schemas/EditActor"
        note:
          maxLength: 2000
          type: string
        set:
          additionalProperties: {}
          description: Field-key → corrected value (change or add)
          type: object
        unset:
          description: Field keys to reject from the patch
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - actor
      type: object
    EditAmendmentView:
      additionalProperties: false
      properties:
        amender_uid:
          format: int64
          type: integer
        created_at:
          format: date-time
          type: string
        id:
          format: int64
          type: integer
        note:
          type: string
        seq:
          format: int64
          type: integer
        set:
          additionalProperties: {}
          type: object
        unset:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - id
        - seq
        - amender_uid
        - note
        - created_at
      type: object
    EditDecisionRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EditDecisionRequest.json
          format: uri
          readOnly: true
          type: string
        actor:
          $ref: "#/components/schemas/EditActor"
        note:
          description: Merge note / decline reason (kept on the proposal)
          maxLength: 2000
          type: string
      required:
        - actor
      type: object
    EditDiffResponse:
      additionalProperties: false
      properties:
        fields:
          items:
            $ref: "#/components/schemas/EditFieldDiffView"
          type:
            - array
            - "null"
        from_seq:
          format: int64
          type: integer
        to_seq:
          format: int64
          type: integer
      required:
        - from_seq
        - to_seq
        - fields
      type: object
    EditFieldDiffView:
      additionalProperties: false
      properties:
        diff_hint:
          type: string
        from: {}
        key:
          type: string
        kind:
          type: string
        to: {}
      required:
        - key
        - from
        - to
      type: object
    EditProposalCreateRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EditProposalCreateRequest.json
          format: uri
          readOnly: true
          type: string
        actor:
          $ref: "#/components/schemas/EditActor"
        entity_id:
          format: int64
          minimum: 1
          type: integer
        entity_type:
          description: Registered entity type, e.g. catalog.work
          minLength: 1
          type: string
        note:
          maxLength: 2000
          type: string
        patch:
          additionalProperties: {}
          description: Field-key → new-value document (registered keys only)
          type: object
        site:
          description: Filing tenant; must equal the client's catalog_site binding
          minLength: 1
          type: string
      required:
        - entity_type
        - entity_id
        - site
        - patch
        - actor
      type: object
    EditProposalCreateResponse:
      additionalProperties: false
      properties:
        merged:
          description: true when the direct-edit sugar landed the patch immediately
          type: boolean
        proposal:
          $ref: "#/components/schemas/EditProposalView"
        revision:
          $ref: "#/components/schemas/EditRevisionView"
          description: The produced revision when merged
      required:
        - proposal
        - merged
      type: object
    EditProposalListResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/EditProposalView"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    EditProposalView:
      additionalProperties: false
      properties:
        amendments:
          description: Seq-ordered (detail endpoint only)
          items:
            $ref: "#/components/schemas/EditAmendmentView"
          type:
            - array
            - "null"
        base_revision_seq:
          format: int64
          type: integer
        created_at:
          format: date-time
          type: string
        decided_at:
          format: date-time
          type: string
        decided_by_uid:
          format: int64
          type: integer
        decision_note:
          type: string
        effective_patch:
          additionalProperties: {}
          description: patch ⊕ amendments (detail endpoint only)
          type: object
        entity_family:
          type: string
        entity_id:
          format: int64
          type: integer
        entity_type:
          type: string
        id:
          format: int64
          type: integer
        note:
          type: string
        patch:
          additionalProperties: {}
          type: object
        proposer_uid:
          format: int64
          type: integer
        site:
          type: string
        status:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - entity_family
        - entity_type
        - entity_id
        - base_revision_seq
        - patch
        - proposer_uid
        - note
        - site
        - status
        - created_at
        - updated_at
      type: object
    EditRevertRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EditRevertRequest.json
          format: uri
          readOnly: true
          type: string
        actor:
          $ref: "#/components/schemas/EditActor"
        entity_id:
          format: int64
          minimum: 1
          type: integer
        entity_type:
          minLength: 1
          type: string
        note:
          maxLength: 2000
          type: string
        site:
          minLength: 1
          type: string
        to_seq:
          description: Target revision seq to restore
          format: int64
          minimum: 1
          type: integer
      required:
        - entity_type
        - entity_id
        - to_seq
        - site
        - actor
      type: object
    EditRevertResponse:
      additionalProperties: false
      properties:
        proposal:
          $ref: "#/components/schemas/EditProposalView"
        revision:
          $ref: "#/components/schemas/EditRevisionView"
      required:
        - proposal
        - revision
      type: object
    EditRevisionListResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/EditRevisionView"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    EditRevisionView:
      additionalProperties: false
      properties:
        action:
          type: string
        actor_uid:
          format: int64
          type: integer
        amender_uid:
          format: int64
          type: integer
        changed_fields:
          items:
            type: string
          type:
            - array
            - "null"
        created_at:
          format: date-time
          type: string
        entity_family:
          type: string
        entity_id:
          format: int64
          type: integer
        entity_type:
          type: string
        id:
          format: int64
          type: integer
        proposal_id:
          format: int64
          type: integer
        seq:
          format: int64
          type: integer
        site:
          type: string
        snapshot:
          additionalProperties: {}
          type: object
      required:
        - id
        - entity_family
        - entity_type
        - entity_id
        - seq
        - action
        - changed_fields
        - snapshot
        - actor_uid
        - site
        - created_at
      type: object
    EditSchemaFieldView:
      additionalProperties: false
      properties:
        can_propose:
          type: boolean
        can_review:
          type: boolean
        deprecated:
          type: boolean
        diff_hint:
          type: string
        key:
          type: string
        kind:
          type: string
        locked:
          type: boolean
        would_automerge:
          description: A proposal by this caller would merge instantly
          type: boolean
      required:
        - key
        - kind
        - diff_hint
        - locked
        - can_propose
        - can_review
        - would_automerge
      type: object
    EditSchemaResponse:
      additionalProperties: false
      properties:
        entity_type:
          type: string
        fields:
          items:
            $ref: "#/components/schemas/EditSchemaFieldView"
          type:
            - array
            - "null"
      required:
        - entity_type
        - fields
      type: object
    EditWithdrawRequest:
      additionalProperties: false
