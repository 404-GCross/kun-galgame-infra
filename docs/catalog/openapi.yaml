components:
  schemas:
    AnchorRef:
      additionalProperties: false
      properties:
        external_id:
          type: string
        link_kind:
          description: 0=exact 1=probable 2=related
          format: int32
          type: integer
        matched_by:
          type: string
        source:
          type: string
      required:
        - source
        - external_id
        - link_kind
      type: object
    AnchorTierCell:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        link_kind:
          description: 0=exact 1=probable 2=related
          format: int32
          type: integer
        source:
          type: string
      required:
        - source
        - link_kind
        - count
      type: object
    CatalogStats:
      additionalProperties: false
      properties:
        anchors_by_source_tier:
          items:
            $ref: "#/components/schemas/AnchorTierCell"
          type:
            - array
            - "null"
        attributions_by_kind:
          items:
            $ref: "#/components/schemas/KindCount"
          type:
            - array
            - "null"
        credits_by_source:
          items:
            $ref: "#/components/schemas/KeyCount"
          type:
            - array
            - "null"
        entities:
          $ref: "#/components/schemas/EntityCounts"
        llm_bid_verdicts:
          items:
            $ref: "#/components/schemas/KeyCount"
          type:
            - array
            - "null"
        queues:
          $ref: "#/components/schemas/QueueLevels"
        source_freshness:
          items:
            $ref: "#/components/schemas/SourceFreshness"
          type:
            - array
            - "null"
        works:
          $ref: "#/components/schemas/WorksMatrix"
      required:
        - works
        - entities
        - credits_by_source
        - attributions_by_kind
        - anchors_by_source_tier
        - queues
        - llm_bid_verdicts
        - source_freshness
      type: object
    ClaimAnchor:
      additionalProperties: false
      properties:
        external_id:
          minLength: 1
          type: string
        level:
          description: Anchor grain; defaults to work
          enum:
            - work
            - release
          type: string
        source_id:
          description: catalog_source registry id (e.g. 2=vndb 3=bangumi 4=dlsite)
          format: int32
          type: integer
      required:
        - source_id
        - external_id
      type: object
    ClaimWorkRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ClaimWorkRequest.json
          format: uri
          readOnly: true
          type: string
        anchors:
          description: External identity anchors; matched exact refs claim the existing registry row
          items:
            $ref: "#/components/schemas/ClaimAnchor"
          maxItems: 16
          type:
            - array
            - "null"
        content_rating:
          description: 0=all_ages 1=sensitive 2=r18
          format: int32
          maximum: 2
          minimum: 0
          type: integer
        display_name:
          minLength: 1
          type: string
        medium_id:
          description: catalog_medium registry id (1=galgame ...)
          format: int32
          type: integer
        olang:
          description: Original language (BCP-47); defaults to ja
          type: string
        product_work_id:
          description: The work's id inside the product database
          format: int64
          type: integer
        site:
          description: Claiming site key (e.g. galgame_wiki)
          minLength: 1
          type: string
      required:
        - medium_id
        - site
        - product_work_id
        - display_name
      type: object
    ClaimWorkResponse:
      additionalProperties: false
      properties:
        created:
          description: true when a new registry row was minted (no anchor matched)
          type: boolean
        work_id:
          format: int64
          type: integer
      required:
        - work_id
        - created
      type: object
    CreditGroup:
      additionalProperties: false
      properties:
        credits:
          items:
            $ref: "#/components/schemas/CreditItem"
          type:
            - array
            - "null"
        role_id:
          format: int64
          type: integer
        role_key:
          type: string
        role_name:
          type: string
      required:
        - role_id
        - role_key
        - role_name
        - credits
      type: object
    CreditItem:
      additionalProperties: false
      properties:
        character:
          type: string
        character_id:
          format: int64
          type: integer
        credit_name_id:
          format: int64
          type: integer
        lang:
          type: string
        latin:
          type: string
        name:
          type: string
        note:
          type: string
        source:
          type: string
      required:
        - credit_name_id
        - name
        - lang
      type: object
    EntityCounts:
      additionalProperties: false
      properties:
        characters:
          format: int64
          type: integer
        credit_names:
          format: int64
          type: integer
        labels:
          format: int64
          type: integer
        orgs:
          format: int64
          type: integer
        orphan_credit_names:
          description: credit_name.person_id IS NULL
          format: int64
          type: integer
        persons:
          format: int64
          type: integer
      required:
        - persons
        - credit_names
        - orphan_credit_names
        - orgs
        - labels
        - characters
      type: object
    EntitySearchHit:
      additionalProperties: false
      properties:
        entity_type:
          type: string
        id:
          description: "prefixed: n{id} / c{id} / b{id}"
          type: string
        kind:
          description: label kind (labels only)
          format: int32
          type: integer
        latin:
          type: string
        name:
          type: string
        person_id:
          description: credit-name → person link (names only; absent = orphan)
          format: int64
          type: integer
        popularity:
          format: double
          type: number
        sources:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - id
        - entity_type
        - name
        - sources
        - popularity
      type: object
    EntitySearchResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/EntitySearchHit"
          type:
            - array
            - "null"
        total:
          format: int64
          type: integer
      required:
        - items
        - total
      type: object
    EnvelopeCatalogStats:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeCatalogStats.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/CatalogStats"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopeClaimWorkResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeClaimWorkResponse.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/ClaimWorkResponse"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopeEntitySearchResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeEntitySearchResponse.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/EntitySearchResponse"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopeLabelWorksResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeLabelWorksResponse.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/LabelWorksResponse"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopeRedirectFeedResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeRedirectFeedResponse.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/RedirectFeedResponse"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopeResolveResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeResolveResponse.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/ResolveResponse"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopeWorkByAnchorResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeWorkByAnchorResponse.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/WorkByAnchorResponse"
        message:
          type: string
      required:
        - code
        - message
      type: object
    EnvelopeWorkCreditsResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EnvelopeWorkCreditsResponse.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data:
          $ref: "#/components/schemas/WorkCreditsResponse"
        message:
          type: string
      required:
        - code
        - message
      type: object
    HouseError:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/HouseError.json
          format: uri
          readOnly: true
          type: string
        code:
          format: int64
          type: integer
        data: {}
        message:
          type: string
      required:
        - code
        - message
      type: object
    KeyCount:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        key:
          type: string
      required:
        - key
        - count
      type: object
    KindCount:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        kind:
          format: int32
          type: integer
      required:
        - kind
        - count
      type: object
    LabelHead:
      additionalProperties: false
      properties:
        display_name:
          type: string
        id:
          format: int64
          type: integer
        kind:
          description: label kind (0=game_brand … 4=doujin_circle …)
          format: int32
          type: integer
      required:
        - id
        - display_name
        - kind
      type: object
    LabelWorkRow:
      additionalProperties: false
      properties:
        content_rating:
          format: int32
          type: integer
        display_name:
          type: string
        kind:
          description: attribution edge kind
          format: int32
          type: integer
        medium_id:
          format: int32
          type: integer
        status:
          format: int32
          type: integer
        work_id:
          format: int64
          type: integer
      required:
        - work_id
        - display_name
        - medium_id
        - content_rating
        - status
        - kind
      type: object
    LabelWorksResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/LabelWorkRow"
          type:
            - array
            - "null"
        label:
          $ref: "#/components/schemas/LabelHead"
        total:
          format: int64
          type: integer
      required:
        - label
        - total
        - items
      type: object
    QueueLevels:
      additionalProperties: false
      properties:
        candidates_by_status:
          items:
            $ref: "#/components/schemas/StatusCount"
          type:
            - array
            - "null"
        probable_refs:
          format: int64
          type: integer
        proposals_by_status:
          items:
            $ref: "#/components/schemas/StatusCount"
          type:
            - array
            - "null"
        rejections:
          format: int64
          type: integer
      required:
        - candidates_by_status
        - proposals_by_status
        - probable_refs
        - rejections
      type: object
    RedirectFeedResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/RedirectItem"
          type:
            - array
            - "null"
        next_cursor:
          description: Opaque cursor for the next page; empty when this page is not full
          type: string
      required:
        - items
      type: object
    RedirectItem:
      additionalProperties: false
      properties:
        current_id:
          format: int64
          type: integer
        entity_type:
          format: int32
          type: integer
        merged_at:
          format: date-time
          type: string
        old_id:
          format: int64
          type: integer
      required:
        - entity_type
        - old_id
        - current_id
        - merged_at
      type: object
    ReleaseBrief:
      additionalProperties: false
      properties:
        anchors:
          items:
            $ref: "#/components/schemas/AnchorRef"
          type:
            - array
            - "null"
        id:
          format: int64
          type: integer
        kind:
          description: 0=default 1=digital 2=physical 3=trial 4=patch
          format: int32
          type: integer
        released_d:
          format: int32
          type: integer
        released_m:
          format: int32
          type: integer
        released_y:
          format: int32
          type: integer
      required:
        - id
        - kind
        - anchors
      type: object
    ResolveRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ResolveRequest.json
          format: uri
          readOnly: true
          type: string
        entity_type:
          description: Entity type constant (0=person 1=credit_name 2=org 3=label 4=character 5=work 6=release)
          format: int32
          maximum: 6
          minimum: 0
          type: integer
        ids:
          description: Entity ids to resolve
          items:
            format: int64
            type: integer
          maxItems: 1000
          minItems: 1
          type:
            - array
            - "null"
      required:
        - entity_type
        - ids
      type: object
    ResolveResponse:
      additionalProperties: false
      properties:
        mappings:
          additionalProperties:
            format: int64
            type: integer
          description: old id (as string key) → canonical id; unredirected ids map to themselves
          type: object
        redirected:
          description: The subset of requested ids that had a redirect
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
      required:
        - mappings
      type: object
    SourceFreshness:
      additionalProperties: false
      properties:
        latest_ref:
          description: RFC3339 max(created_at) of that source's anchors
          type: string
        source:
          type: string
      required:
        - source
      type: object
    StatusCount:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        status:
          format: int32
          type: integer
      required:
        - status
        - count
      type: object
    WorkByAnchorResponse:
      additionalProperties: false
      properties:
        labels:
          items:
            $ref: "#/components/schemas/WorkLabel"
          type:
            - array
            - "null"
        refs:
          items:
            $ref: "#/components/schemas/WorkRef"
          type:
            - array
            - "null"
        releases:
          items:
            $ref: "#/components/schemas/ReleaseBrief"
          type:
            - array
            - "null"
        titles:
          items:
            $ref: "#/components/schemas/WorkTitle"
          type:
            - array
            - "null"
        work:
          $ref: "#/components/schemas/WorkCore"
      required:
        - work
        - titles
        - releases
        - labels
        - refs
      type: object
    WorkCore:
      additionalProperties: false
      properties:
        content_rating:
          description: 0=all_ages 1=sensitive 2=r18
          format: int32
          type: integer
        display_name:
          type: string
        id:
          format: int64
          type: integer
        medium_id:
          format: int32
          type: integer
        olang:
          type: string
        product_work_id:
          format: int64
          type: integer
        site:
          type: string
        status:
          description: 0=live 1=stub 2=merged
          format: int32
          type: integer
      required:
        - id
        - medium_id
        - display_name
        - olang
        - content_rating
        - status
      type: object
    WorkCreditsResponse:
      additionalProperties: false
      properties:
        groups:
          items:
            $ref: "#/components/schemas/CreditGroup"
          type:
            - array
            - "null"
        work_id:
          format: int64
          type: integer
      required:
        - work_id
        - groups
      type: object
    WorkLabel:
      additionalProperties: false
      properties:
        display_name:
          type: string
        kind:
          description: "attribution nature: 0=circle 1=publisher 2=developer 3=brand"
          format: int32
          type: integer
        label_id:
          format: int64
          type: integer
        label_kind:
          description: the label's own kind (0=game_brand … 4=doujin_circle …)
          format: int32
          type: integer
      required:
        - label_id
        - display_name
        - label_kind
        - kind
      type: object
    WorkRef:
      additionalProperties: false
      properties:
        external_id:
          type: string
        level:
          description: work | release
          type: string
        release_id:
          description: present when level=release
          format: int64
          type: integer
        source:
          type: string
      required:
        - source
        - external_id
        - level
      type: object
    WorkTitle:
      additionalProperties: false
      properties:
        kind:
          description: 0=official 1=alias 2=abbreviation 3=search_hint
          format: int32
          type: integer
        lang:
          type: string
        latin:
          type: string
        title:
          type: string
      required:
        - lang
        - title
        - kind
      type: object
    WorksCell:
      additionalProperties: false
      properties:
        claimed:
          type: boolean
        count:
          format: int64
          type: integer
        medium_id:
          format: int32
          type: integer
        status:
          description: 0=live 1=stub 2=merged
          format: int32
          type: integer
      required:
        - medium_id
        - claimed
        - status
        - count
      type: object
    WorksMatrix:
      additionalProperties: false
      properties:
        cells:
          items:
            $ref: "#/components/schemas/WorksCell"
          type:
            - array
            - "null"
        total:
          format: int64
          type: integer
      required:
        - total
        - cells
      type: object
info:
  title: KUN Catalog Service
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/catalog/labels/{id}/works:
    get:
      operationId: getCatalogLabelWorks
      parameters:
        - description: Catalog label id
          in: path
          name: id
          required: true
          schema:
            description: Catalog label id
            format: int64
            type: integer
        - description: Page size (capped at 50)
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Page size (capped at 50)
            format: int64
            type: integer
        - description: Rows to skip
          explode: false
          in: query
          name: offset
          schema:
            description: Rows to skip
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLabelWorksResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Works attributed to a label (circle→works reverse, paginated)
      tags:
        - catalog-s2s
  /api/v1/catalog/redirects:
    get:
      operationId: listCatalogRedirects
      parameters:
        - description: Filter to one entity type; -1 = all
          explode: false
          in: query
          name: entity_type
          schema:
            default: -1
            description: Filter to one entity type; -1 = all
            format: int32
            type: integer
        - description: Opaque cursor from the previous page's next_cursor
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from the previous page's next_cursor
            type: string
        - description: Page size (max 1000)
          explode: false
          in: query
          name: limit
          schema:
            description: Page size (max 1000)
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRedirectFeedResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Keyset feed of redirects for product-site id cleanup crons
      tags:
        - catalog-s2s
  /api/v1/catalog/resolve:
    post:
      operationId: resolveCatalogIDs
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeResolveResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Resolve entity ids to their canonical ids (redirect following, batch)
      tags:
        - catalog-s2s
  /api/v1/catalog/search/entities:
    get:
      operationId: searchCatalogEntities
      parameters:
        - description: Search text; empty returns the most-credited entities
          explode: false
          in: query
          name: q
          schema:
            description: Search text; empty returns the most-credited entities
            type: string
        - description: Which entity index to search
          explode: false
          in: query
          name: type
          schema:
            description: Which entity index to search
            enum:
              - names
              - characters
              - labels
            type: string
        - description: UI locale; the server pins the query language (client-supplied Meili locales are never accepted)
          explode: false
          in: query
          name: locale
          schema:
            description: UI locale; the server pins the query language (client-supplied Meili locales are never accepted)
            enum:
              - zh
              - ja
              - en
            type: string
        - description: Max hits (capped at 20)
          explode: false
          in: query
          name: limit
          schema:
            default: 20
            description: Max hits (capped at 20)
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeEntitySearchResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Search catalog entities (credit names / characters / labels)
      tags:
        - catalog-s2s
  /api/v1/catalog/stats:
    get:
      operationId: getCatalogStats
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCatalogStats"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseError"
          description: Error
      summary: Dashboard counts for the internal data browser (one round-trip)
      tags:
        - catalog-s2s
  /api/v1/catalog/works/by-anchor:
    get:
      operationId: getCatalogWorkByAnchor
      parameters:
        - description: Source key (dlsite/vndb/bangumi/erogamespace/…), validated against the source registry
          explode: false
          in: query
          name: source
          schema:
            description: Source key (dlsite/vndb/bangumi/erogamespace/…), validated against the source registry
            minLength: 1
            type: string
