          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Incremental works changes feed ((updated,id) keyset; next_cursor always present — keep polling it for new rows)
      tags:
        - catalog-public
