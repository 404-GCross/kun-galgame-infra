info:
  title: NextMoe Open API — Catalog
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/catalog/characters/{id}:
    get:
      operationId: getCatalogCharacterPublic
      parameters:
        - description: Catalog character id
          in: path
          name: id
          required: true
          schema:
            description: Catalog character id
            format: int64
            type: integer
        - description: works = attach the works this character appears in
          explode: false
          in: query
          name: include
          schema:
            description: works = attach the works this character appears in
            type: string
        - description: Works per page 1-50 (default 50)
          explode: false
          in: query
          name: limit
          schema:
            description: Works per page 1-50 (default 50)
            format: int64
            type: integer
        - description: Rows to skip
          explode: false
          in: query
          name: offset
          schema:
            description: Rows to skip
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicCharacter"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Character identity; include=works attaches the works it appears in with voice names
      tags:
        - catalog-public
  /v1/catalog/labels/{id}:
    get:
      operationId: getCatalogLabelPublic
      parameters:
        - description: Catalog label id
          in: path
          name: id
          required: true
          schema:
            description: Catalog label id
            format: int64
            type: integer
        - description: works = attach the works attributed to this label
          explode: false
          in: query
          name: include
          schema:
            description: works = attach the works attributed to this label
            type: string
        - description: Works per page 1-50 (default 50)
          explode: false
          in: query
          name: limit
          schema:
            description: Works per page 1-50 (default 50)
            format: int64
            type: integer
        - description: Rows to skip
          explode: false
          in: query
          name: offset
          schema:
            description: Rows to skip
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicLabel"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Label (brand / circle / publisher …) identity; include=works attaches attributed works
      tags:
        - catalog-public
  /v1/catalog/lookup:
    get:
      operationId: lookupCatalogPublic
      parameters:
        - description: "Upstream source key: vndb | bangumi | dlsite | erogamescape (the internal registry spelling erogamespace is accepted too)"
          explode: false
          in: query
          name: source
          schema:
            description: "Upstream source key: vndb | bangumi | dlsite | erogamescape (the internal registry spelling erogamespace is accepted too)"
            type: string
        - description: The id within that source (vndb accepts v19658 or 19658; dlsite RJ/VJ numbers)
          explode: false
          in: query
          name: external_id
          schema:
            description: The id within that source (vndb accepts v19658 or 19658; dlsite RJ/VJ numbers)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicLookupData"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Reverse-lookup an external id to its catalog work via an EXACT anchor (killer feature); 404 on miss/hidden
      tags:
        - catalog-public
  /v1/catalog/lookup/batch:
    post:
      operationId: lookupCatalogBatchPublic
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicLookupBatchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicLookupBatchData"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Batch external-id reverse-lookup (≤100 pairs); misses return a null work in order
      tags:
        - catalog-public
  /v1/catalog/names/{id}:
    get:
      operationId: getCatalogNamePublic
      parameters:
        - description: Credit-name id (the addressable credited identity)
          in: path
          name: id
          required: true
          schema:
            description: Credit-name id (the addressable credited identity)
            format: int64
            type: integer
        - description: credits = attach the works this name is credited on
          explode: false
          in: query
          name: include
          schema:
            description: credits = attach the works this name is credited on
            type: string
        - description: Credits per page 1-50 (default 50)
          explode: false
          in: query
          name: limit
          schema:
            description: Credits per page 1-50 (default 50)
            format: int64
            type: integer
        - description: Rows to skip
          explode: false
          in: query
          name: offset
          schema:
            description: Rows to skip
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicName"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Credited identity (same-person grouping via public links); include=credits attaches works + roles
      tags:
        - catalog-public
  /v1/catalog/redirects:
    get:
      operationId: listCatalogRedirectsPublic
      parameters:
        - description: "Filter to one entity type: person|name|org|label|character|work|release"
          explode: false
          in: query
          name: entity_type
          schema:
            description: "Filter to one entity type: person|name|org|label|character|work|release"
            type: string
        - description: Opaque keyset cursor from a prior response's next_cursor; omit for the first page
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque keyset cursor from a prior response's next_cursor; omit for the first page
            type: string
        - description: Items per page 1-500 (default 100)
          explode: false
          in: query
          name: limit
          schema:
            description: Items per page 1-500 (default 100)
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicRedirectsData"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Keyset feed of id-convergence (merge) events for stored-id cleanup; filter by entity_type
      tags:
        - catalog-public
  /v1/catalog/resolve:
    post:
      operationId: resolveCatalogPublic
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicResolveRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicResolveData"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Batch old id → canonical id (redirect flattening) for a given entity_type
      tags:
        - catalog-public
  /v1/catalog/search:
    get:
      operationId: searchCatalogEntitiesPublic
      parameters:
        - description: Which entity index to search
          explode: false
          in: query
          name: type
          schema:
            description: Which entity index to search
            enum:
              - names
              - characters
              - labels
            type: string
        - description: Search text; empty returns the most-credited entities
          explode: false
          in: query
          name: q
          schema:
            description: Search text; empty returns the most-credited entities
            type: string
        - description: UI locale; the server pins the query language
          explode: false
          in: query
          name: locale
          schema:
            description: UI locale; the server pins the query language
            enum:
              - zh
              - ja
              - en
            type: string
        - description: Max hits (capped at 20)
          explode: false
          in: query
          name: limit
          schema:
            description: Max hits (capped at 20)
            format: int64
            type: integer
      responses:
        "200":
