# Image Service preset configuration.
#
# main_pipeline is the global compression policy applied to every uploaded
# image regardless of preset. Each preset additionally declares variants
# (extra derivative images to generate on top of the main one).

main_pipeline:
  fit_width: 1920
  fit_height: 1080
  format: webp
  quality: 77
  strip_exif: true

presets:
  # User avatars. 256 is the main display size (square, cover). 100 is for
  # comments / small mentions.
  avatar:
    variants:
      - name: "256"
        width: 256
        height: 256
        fit: cover
        format: webp
        quality: 77
      - name: "100"
        width: 100
        height: 100
        fit: cover
        format: webp
        quality: 77
    allowed_mime:
      - image/jpeg
      - image/png
      - image/webp

  # galgame wiki banner thumbnails (aspect-preserving fill to 460x259).
  galgame_banner:
    variants:
      - name: "mini"
        width: 460
        height: 259
        fit: cover
        format: webp
        quality: 77
    allowed_mime:
      - image/jpeg
      - image/png
      - image/webp

  # galgame wiki gallery screenshots. The gallery grid renders a `mini`
  # thumbnail (460x259, matching galgame_banner) while the lightbox shows the
  # full image. Split out for the same reasons `message` is split from `topic`:
  # its own CDN folder + independent quota gating, and an explicit name for the
  # "galgame screenshot" asset.
  # Before this preset existed kungal reused `galgame_banner` and moyu reused
  # `topic` — neither expressed intent and the two diverged. MIME is the union
  # of both old presets (incl. gif) so migrating either consumer onto this name
  # is non-breaking.
  galgame_screenshot:
    variants:
      - name: "mini"
        width: 460
        height: 259
        fit: cover
        format: webp
        quality: 77
    allowed_mime:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif

  # Catalog character portraits (the shared cross-media entity layer). VNDB
  # character images are small, vertical head/bust shots; the `mini` variant is
  # a portrait-oriented thumbnail for character cards / roster grids (the same
  # "one mini variant" shape as the galgame cover presets, just portrait rather
  # than landscape). Uploaded under site_key "catalog" by the step-48 backfill.
  character:
    variants:
      - name: "mini"
        width: 256
        height: 360
        fit: cover
        format: webp
        quality: 77
    allowed_mime:
      - image/jpeg
      - image/png
      - image/webp

  # Topic / inline post images. Main image only; no extra variants.
  topic:
    variants: []
    allowed_mime:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif

  # Private-message / chat inline images. Same handling as topic (main image
  # only; global main_pipeline applies: webp q77, ≤1920×1080, EXIF stripped).
  # Kept as its own preset so chat images get their own CDN folder + can be
  # quota-gated independently of topic uploads.
  message:
    variants: []
    allowed_mime:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif
