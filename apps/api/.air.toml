#:schema https://json.schemastore.org/any.json

# Air config — builds all Go services, runs them via dev.sh
# https://github.com/air-verse/air

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
# Build all services
cmd = "go build -o ./tmp/oauth ./cmd/oauth && go build -o ./tmp/galgame ./cmd/galgame && go build -o ./tmp/artifact ./cmd/artifact && go build -o ./tmp/moderation ./cmd/moderation"
# Run via dev.sh which manages all processes
entrypoint = "./dev.sh"
# Watch these extensions
include_ext = ["go", "env"]
# Exclude directories
exclude_dir = ["assets", "tmp", "vendor", "testdata", "build", "node_modules"]
exclude_file = []
exclude_regex = ["_test.go", ".*_test\\.go"]
exclude_unchanged = false
follow_symlink = false
args_bin = []
# Delay before restarting (ms)
delay = 1000
log = "build-errors.log"
stop_on_error = false
send_interrupt = true
kill_delay = "2s"
rerun = false
rerun_delay = 500

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
time = false
main_only = true
silent = false

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
