# kun-galgame-infra — PRODUCTION compose (Dokploy + GHCR prebuilt images).
#
# Differs from docker-compose.yml (local/dev):
#   1. `image: ghcr.io/kunmoe/infra-*` — NOT `build:`. CI builds+pushes; Dokploy PULLS.
#   2. `expose:` (container-network only) not `ports:` — Traefik routes internally.
#   3. network = `dokploy-network` (external) — shared by the 3 Dokploy apps.
#   4. **NO `env_file`** — all runtime config is inline `environment:` here, so Dokploy
#      needs no `docker/*.env` files on disk. Non-secret/structural values are literal;
#      secrets + deploy-specifics come from **Dokploy's Environment panel** via `${VAR}`.
#
# Set these in the infra app's Dokploy **Environment**:
#   POSTGRES_PASSWORD  JWT_SECRET  MEILI_MASTER_KEY  MINIO_ROOT_USER  MINIO_ROOT_PASSWORD
#   KUN_IMAGE_S3_ENDPOINT  KUN_IMAGE_S3_ACCESS_KEY  KUN_IMAGE_S3_SECRET_KEY   (R2/MinIO)
#   KUN_VISUAL_NOVEL_EMAIL_PASSWORD                                          (SMTP, 可选)
# Within infra, oauth/image/galgame all read the SAME ${JWT_SECRET}/${POSTGRES_PASSWORD}/
# ${MEILI_MASTER_KEY} → intra-app consistency is automatic.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d postgres redis minio meili
#   docker compose -f docker-compose.prod.yml --profile jobs run --rm migrate           # oauth schema + seed
#   docker compose -f docker-compose.prod.yml --profile jobs run --rm migrate-galgame    # wiki schema
#   docker compose -f docker-compose.prod.yml up -d oauth image galgame web wiki
#   # full data cutover (16-data-cutover.md): docker compose ... run --rm tools <job> ...
name: kun-galgame-infra

x-svc-health: &svc-health
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 15s

# ── shared backend env (union; services ignore keys they don't read) ──────────
# Literal = non-secret/structural. ${VAR:?} = required secret (set in Dokploy).
# ${VAR:-default} = optional override.
x-infra-env: &infra-env
  KUN_ENV: production
  # Postgres (one server, 5 DBs)
  KUN_PG_HOST: postgres
  KUN_PG_PORT: "5432"
  KUN_PG_USER: postgres
  KUN_PG_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Dokploy Environment}
  KUN_PG_DATABASE: kun_galgame_infra
  KUN_PG_SSLMODE: disable
  KUN_PG_TIMEZONE: Asia/Shanghai
  KUN_GALGAME_PG_DATABASE: kun_galgame_wiki
  KUN_IMAGES_PG_DATABASE: kun_images
  # Redis
  REDIS_ENABLED: "true"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  # JWT — oauth signs access_token (HS256), image/galgame verify locally. Same secret.
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in Dokploy Environment (shared by oauth/image/galgame)}
  # CORS — real https web origins
  KUN_FRONTEND_CORS_ORIGIN: https://oauth.kungal.com,https://www.kungal.com,https://kungal.com,https://wiki.kungal.com,https://www.moyu.moe,https://moyu.moe
  # oauth identity URLs
  KUN_SITE_URL: https://oauth.kungal.com
  KUN_FRONTEND_URL: https://oauth.kungal.com
  # image_service S3 — Cloudflare R2 in prod (keys/endpoint from Dokploy). For
  # self-hosted MinIO set ENDPOINT=http://minio:9000 / FORCE_PATH_STYLE=true.
  # image 服务空 key/secret/bucket 会 os.Exit(1) → 崩溃重启,所以这三个 fail-fast。
  # 自托管 MinIO:ENDPOINT=http://minio:9000、key/secret=MINIO_ROOT_*、FORCE_PATH_STYLE=true。
  KUN_IMAGE_S3_ENDPOINT: ${KUN_IMAGE_S3_ENDPOINT:?R2/MinIO 端点,如 https://<acct>.r2.cloudflarestorage.com 或 http://minio:9000}
  KUN_IMAGE_S3_REGION: ${KUN_IMAGE_S3_REGION:-auto}
  KUN_IMAGE_S3_ACCESS_KEY: ${KUN_IMAGE_S3_ACCESS_KEY:?image 服务必填(空则启动即退出)}
  KUN_IMAGE_S3_SECRET_KEY: ${KUN_IMAGE_S3_SECRET_KEY:?image 服务必填}
  KUN_IMAGE_S3_BUCKET: ${KUN_IMAGE_S3_BUCKET:-kun-images}
  KUN_IMAGE_S3_FORCE_PATH_STYLE: ${KUN_IMAGE_S3_FORCE_PATH_STYLE:-false}
  KUN_IMAGE_PUBLIC_BASE_URL: https://image.kungal.iloveren.link
  KUN_IMAGE_CLIENT_BASE_URL: http://image:9278
  # Meilisearch — galgame uses; key MUST == meili MEILI_MASTER_KEY (same ${VAR})
  KUN_MEILISEARCH_HOST: http://meili:7700
  KUN_MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in Dokploy Environment}
  # Mail — oauth uses; PASSWORD is the only secret
  KUN_VISUAL_NOVEL_EMAIL_FROM: 鲲 Galgame OAuth
  KUN_VISUAL_NOVEL_EMAIL_HOST: tuesday.mxrouting.net
  KUN_VISUAL_NOVEL_EMAIL_PORT: "587"
  KUN_VISUAL_NOVEL_EMAIL_ACCOUNT: auth@kungal.com
  KUN_VISUAL_NOVEL_EMAIL_PASSWORD: ${KUN_VISUAL_NOVEL_EMAIL_PASSWORD:-}

services:
  # ───────────────────────── shared backing services ─────────────────────────
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Dokploy (must match the app KUN_PG_PASSWORD / DATABASE_URL)}
      POSTGRES_DB: kun_galgame_infra
    volumes:
      - pg:/var/lib/postgresql   # pg18: VOLUME moved here (was /data on <=17)
      - ./docker/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kun_galgame_infra"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in Dokploy}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in Dokploy}
    volumes: ["minio:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      <<: *svc-health
    restart: unless-stopped
    # Prod usually serves images from Cloudflare R2; this MinIO is only needed when
    # self-hosting blobs. Safe to leave running unused.

  meili:
    image: getmeili/meilisearch:v1.45
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in Dokploy (≥16 bytes — MEILI_ENV=production 强制)}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: production
    volumes: ["meili:/meili_data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      <<: *svc-health
    networks:
      default:
        aliases: [meilisearch]   # kungal connects by the name `meilisearch`
    restart: unless-stopped

  # ───────────────────────────── Go services ─────────────────────────────────
  oauth:
    image: ghcr.io/kunmoe/infra-oauth:latest
    environment:
      <<: *infra-env
      KUN_FIBER_SERVER_HOST: 0.0.0.0
      KUN_FIBER_SERVER_PORT: "9277"
    expose: ["9277"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/app/app", "healthcheck"]
      <<: *svc-health
    restart: unless-stopped

  image:
    image: ghcr.io/kunmoe/infra-image:latest
    environment:
      <<: *infra-env
      KUN_IMAGE_SERVICE_HOST: 0.0.0.0
      KUN_IMAGE_SERVICE_PORT: "9278"
      KUN_IMAGE_UPLOAD_ENABLED: "true"
    expose: ["9278"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/app/app", "healthcheck"]
      <<: *svc-health
    restart: unless-stopped

  galgame:
    image: ghcr.io/kunmoe/infra-galgame:latest
    environment:
      <<: *infra-env
      KUN_FIBER_SERVER_HOST: 0.0.0.0
      KUN_GALGAME_PORT: "9280"
    expose: ["9280"]
    depends_on:
      postgres: { condition: service_healthy }
      meili: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      <<: *svc-health
    restart: unless-stopped

  # ───────────────────────────── Nuxt frontends ──────────────────────────────
  # Public (browser) config is BAKED into the image at CI build time (build-args in
  # .github/workflows/build.yml). Only the SSR base (service name) is injected here.
  web:
    image: ghcr.io/kunmoe/infra-web:latest
    environment:
      NUXT_API_BASE_SSR: http://oauth:9277/api/v1
    expose: ["3000"]
    depends_on:
      oauth: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      <<: *svc-health
    restart: unless-stopped

  wiki:
    image: ghcr.io/kunmoe/infra-wiki:latest
    environment:
      NUXT_API_BASE_SSR: http://galgame:9280/api
      NUXT_AUTH_API_BASE_SSR: http://oauth:9277/api/v1
    expose: ["3000"]
    depends_on:
      galgame: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      <<: *svc-health
    restart: unless-stopped

  # ─────────────────────── one-off jobs (profile: jobs) ──────────────────────
  #   docker compose -f docker-compose.prod.yml --profile jobs run --rm migrate
  #   docker compose -f docker-compose.prod.yml --profile jobs run --rm migrate-galgame
  migrate:
    image: ghcr.io/kunmoe/infra-migrate:latest
    environment: { <<: *infra-env }
    profiles: ["jobs"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  migrate-galgame:
    image: ghcr.io/kunmoe/infra-migrate-galgame:latest
    environment: { <<: *infra-env }
    profiles: ["jobs"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # All cmd/* binaries (data cutover). Run a job by name (see 16-data-cutover.md):
  #   docker compose -f docker-compose.prod.yml --profile jobs run --rm tools migrate-users --kungal-dsn=... --moyu-dsn=...
  #   docker compose -f docker-compose.prod.yml --profile jobs run --rm tools sync-vndb -tagmap docs/tagMap.ts
  tools:
    image: ghcr.io/kunmoe/infra-tools:latest
    environment: { <<: *infra-env }
    profiles: ["jobs"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

volumes:
  pg:
  redis:
  minio:
  meili:

networks:
  default:
    name: dokploy-network
    external: true
