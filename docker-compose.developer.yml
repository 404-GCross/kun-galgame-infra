# kun-galgame-infra — NextMoe developer portal (developer.nextmoe.dev), STANDALONE.
#
# This is the developer portal split OUT of docker-compose.prod.yml into its OWN
# Dokploy "Compose" project, so portal deploys are triggered MANUALLY and stay
# independent of the main infra stack's webhook cadence (push → CI → auto-redeploy).
#
# Routing: the developer.nextmoe.dev domain is managed in the Dokploy DOMAINS
# PANEL of this project — the Dokploy-native form for a single-service,
# whole-host project (same as the kungal/moyu apps). This ONLY works because the
# service below carries NO labels block: compose-level labels REPLACE Dokploy's
# panel-injected domain labels wholesale (learned the hard way via a production
# oauth 404 on the main stack). Do NOT add a labels block back here — it would
# silently take the domain down on the next deploy.
#
# Same-origin shell: the browser only ever talks to developer.nextmoe.dev; Nitro's
# /api/** relay forwards SERVER-side to the oauth service (NUXT_OAUTH_API_BASE), so
# there is ZERO CORS and no backend change.
#
# Deploy = the Deploy button of this Dokploy project (panel injects the domain
# labels at deploy time; a bare server-side `docker compose up` would NOT).
name: kun-galgame-infra-developer

services:
  # NextMoe developer portal (developer.nextmoe.dev). A same-origin Nuxt shell:
  # the browser only ever talks to this host; Nitro's /api/** relay forwards to
  # the oauth service SERVER-side (NUXT_OAUTH_API_BASE), so there is ZERO CORS and
  # no backend change. Routing = Dokploy Domains panel; NO labels block here (see
  # the file header for why that must stay true).
  developer:
    image: ghcr.io/kunmoe/infra-developer:latest
    pull_policy: always
    environment:
      # SERVER-only base for the /api/** relay — never exposed to the browser.
      # The path is preserved (/api/v1/... → oauth:9277/api/v1/...).
      #
      # `infra-oauth` is a compose-defined network alias on the main stack's
      # oauth service (docker-compose.prod.yml), created for exactly this
      # cross-project call: it survives a recreation of the main Dokploy project
      # (container-name prefixes change, compose aliases don't) and is
      # distinctive enough that no other project on the shared dokploy-network
      # would claim it (bare same-named aliases DNS round-robin across projects).
      NUXT_OAUTH_API_BASE: http://infra-oauth:9277
    expose: ["3000"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      # Inlined from the main stack's *svc-health anchor (which does not exist in
      # this standalone file).
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    # Safety cap for the upstream Nuxt 4.2.2 SSR leak (nuxt#34071). Low-traffic
    # portal; 1g is generous headroom and just OOM-recycles if a leak grows.
    deploy:
      resources:
        limits:
          memory: 1g

networks:
  default:
    name: dokploy-network
    external: true
