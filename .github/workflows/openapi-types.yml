name: openapi-types

# Drift gate for the TypeScript arm of the OpenAPI contracts. The committed
# apps/web/shared/types/generated/*.ts must equal a fresh openapi-typescript run
# against the committed spec — this catches "the spec changed but the generated
# types weren't regenerated" and any hand-edit to a generated file.
#
# Scope: spec -> TS only. The spec-vs-Go-code side is covered separately
# (`go run ./cmd/gen-openapi` re-exports the spec from the Huma code; a future
# oasdiff step flags breaking changes). Together they close the loop
# code -> spec -> TS.

on:
  push:
    paths:
      - "docs/artifact/openapi.yaml"
      - "docs/artifact/admin-openapi.yaml"
      - "apps/web/shared/types/generated/**"
      - "apps/web/package.json"
      - ".github/workflows/openapi-types.yml"
  pull_request:
    paths:
      - "docs/artifact/openapi.yaml"
      - "docs/artifact/admin-openapi.yaml"
      - "apps/web/shared/types/generated/**"
      - "apps/web/package.json"
      - ".github/workflows/openapi-types.yml"

permissions:
  contents: read

jobs:
  drift:
    name: generated TS types match the spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The script uses `pnpm dlx openapi-typescript@<pinned>`, so no install /
      # lockfile entry is needed — it fetches the pinned generator on the fly.
      - name: Regenerate TS types from the committed specs
        run: |
          pnpm -F web run gen:types:artifact
          pnpm -F web run gen:types:artifact-admin
      - name: Fail if the generated types are stale vs the specs
        run: git diff --exit-code -- apps/web/shared/types/generated/
