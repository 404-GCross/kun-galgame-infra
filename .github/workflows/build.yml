# Build every infra image and push to GHCR, then trigger a Dokploy redeploy.
# See docs/deploy/13-registry-ci.md. cgo images (oauth/image) build fine on
# ubuntu-latest — cgo happens inside the build container (cgo.Dockerfile).
#
# web/wiki BAKE their browser-facing public config from build-args here (the
# repo default; oauthClientID/oauthRedirectURI have awkward runtime env names,
# see docker/README.md). Change the https domains below if yours differ, or
# move them to repository Variables and reference ${{ vars.* }}.
name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write            # required to push to GHCR

concurrency:                 # a newer push on the same ref cancels the older build
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: infra-oauth
            file: docker/cgo.Dockerfile
            args: CMD=oauth
          - name: infra-image
            file: docker/cgo.Dockerfile
            args: CMD=image
          - name: infra-galgame
            file: docker/go.Dockerfile
            args: CMD=galgame
          - name: infra-migrate
            file: docker/go.Dockerfile
            args: CMD=migrate
          - name: infra-migrate-galgame
            file: docker/go.Dockerfile
            args: CMD=migrate-galgame
          - name: infra-tools          # every cmd/* binary, for one-off data-cutover jobs
            file: docker/tools.Dockerfile
            args: ""
          - name: infra-web
            file: docker/nuxt.Dockerfile
            args: |
              APP=web
              PUBLIC_API_BASE=https://oauth.kungal.com/api/v1
              PUBLIC_IMAGE_CDN_BASE=https://image.kungal.iloveren.link
          - name: infra-wiki
            file: docker/nuxt.Dockerfile
            args: |
              APP=wiki
              PUBLIC_API_BASE=https://wiki.kungal.com/api
              PUBLIC_AUTH_API_BASE=https://oauth.kungal.com/api/v1
              PUBLIC_OAUTH_AUTHORIZE_BASE=https://oauth.kungal.com/api/v1
              PUBLIC_OAUTH_CLIENT_ID=galgame-wiki-admin
              PUBLIC_OAUTH_REDIRECT_URI=https://wiki.kungal.com/auth/callback
              PUBLIC_IMAGE_CDN_BASE=https://image.kungal.iloveren.link
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          push: true
          tags: |
            ghcr.io/kun1007/${{ matrix.name }}:latest
            ghcr.io/kun1007/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:                    # once every image is pushed, tell Dokploy to pull + redeploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy redeploy
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_INFRA }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DOKPLOY_WEBHOOK_INFRA not set — images pushed to GHCR, skipping redeploy trigger."
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK"
